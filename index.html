<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Enquiry Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>User Enquiry System</h1>
    <div style="text-align: right; max-width: 95%; margin: 10px auto;">
        <button id="logoutBtn" style="width: auto; padding: 8px 15px; background: #e74c3c;">Logout</button>
    </div>
    <div class="container">

        <div class="form-box">
            <h2 id="form-title">Enquiry Form</h2>
            <form id="enquiryForm">
                <input type="hidden" id="editId">

                <label>Your Name</label>
                <input type="text" id="name" placeholder="Enter Your Name">

                <label>Your Email</label>
                <input type="email" id="email" placeholder="Enter Your Email">

                <label>Your Phone</label>
                <input type="text" id="phone" placeholder="Enter Your Phone">

                <label>Your Message</label>
                <textarea id="message" placeholder="Message..."></textarea>

                <button type="submit" id="saveBtn">Save</button>
            </form>
        </div>

        <div class="table-box">
            <h2>Submitted Enquiries (Live Database)</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Message</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="enquiryTableBody">
                    </tbody>
            </table>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
